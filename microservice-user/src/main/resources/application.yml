spring:
  application:
    name: msvc-user
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/userDb
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: create-drop
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8282/realms/ecommerce

keycloak:
  auth-server-url: http://localhost:8282
  realm: ecommerce
  resource: backend-client
  credentials:
    secret: yo4FUA11RWp45kwBMjAeAipaZXKLmRxs

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8093
