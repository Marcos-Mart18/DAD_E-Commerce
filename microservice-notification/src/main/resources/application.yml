spring:
  application:
    name: msvc-notification

  datasource:
    url: jdbc:postgresql://localhost:5437/notificationdb
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  config:
    import: optional:configserver:http://localhost:8888

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: pe.edu.upeu.microservice_notification.api.dto.NotificationEventDto
    listener:
      missing-topics-fatal: false

  mail:  # ¡CORRECTO: Ahora está dentro de 'spring'!
    host: smtp.gmail.com
    port: 587
    username: falconsanchezabel97@gmail.com   # Reemplaza con tu correo real
    password: dlxewmuiswymcnay      # La contraseña generada, sin espacios
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:  # Esto está bien, al mismo nivel que 'spring' y 'server'
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:  # También correcto
  port: 8094